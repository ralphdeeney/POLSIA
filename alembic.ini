# Alembic configuration for Polsia.
#
# `sqlalchemy.url` here is a PLACEHOLDER. env.py resolves the real URL in this
# order:
#   1. `alembic -x db_url=<url> ...`  (explicit per-invocation override)
#   2. this ini value (if set to a real URL, e.g. via `alembic -c other.ini`)
#   3. POLSIA_DATABASE_URL env var / Settings.database_url (polsia.infra.settings)
[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# Placeholder — resolved by env.py (see header above).
sqlalchemy.url = __POLSIA_DATABASE_URL__

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
