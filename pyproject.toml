[project]
name = "polsia"
version = "0.1.0"
description = "Polsia — Autonomous Business Operating System (business-agnostic platform core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.6",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polsia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=polsia --cov-report=term-missing"

[tool.coverage.run]
source = ["polsia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["polsia", "tests"]
# Migration scripts are mechanical/generated and already excluded from mypy.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E", "F", "W",           # pycodestyle/pyflakes
    "I",                      # isort (import ordering)
    "B",                      # bugbear
    "UP",                     # pyupgrade
    "TID",                    # tidy imports (enforce layer boundaries with banned-api/relative parents)
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.mypy-overrides]
# placeholder kept minimal; overrides configured inline above
